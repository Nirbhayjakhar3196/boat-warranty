services:
  app:
    build: .

    env_file:
      - .env.docker

    depends_on:
      db:
        condition: service_healthy

    ports:
      - "3000:3000"

    command: sh -c "npx prisma db push && npm run dev"

  db:
    image: postgres:16-alpine

    container_name: boat-db

    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: boatWarranty

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d boatWarranty"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data: