version: "3.9"

services:
  app:
    build: .
    container_name: boat-app
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/boatWarranty
    depends_on:
      - db
    volumes:
      - .:/app
      - /app/node_modules
    command:
      npm run dev
  
  db:
    image: postgres:16-alpine
    container_name: boat-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: boatWarranty
    ports:
      - "5432:5432"
    volumes:
      - boat-db-data:/var/lib/postgresql/data

volumes:
  postgres-data: